name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # 关键修复：原 workflow 漏了这一步，导致 assembleDebug 直接报 SDK not found
      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform-tools / build-tools 35 / android-35)
        run: |
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      # 把 SDK 路径写进 local.properties，避免 Gradle 找不到 SDK
      - name: Point local.properties to SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mcp-injector-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
